name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Patch Gradle version for Expo SDK 52 compatibility
        run: |
          # Gradle 8.8 = compatible avec AGP 8.3.x (généré par Expo SDK 52)
          # 8.6 = trop vieux, 8.10.2 = trop récent
          sed -i 's|gradle-[0-9.]*-all\.zip|gradle-8.8-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-[0-9.]*-bin\.zip|gradle-8.8-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Vérification ==="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-8.8-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.8-

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
